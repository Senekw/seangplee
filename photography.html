      <script>
        (function () {
          var g = document.querySelector('.gallery'), b = document.getElementById('see-more');
          var imgs = Array.prototype.slice.call(g.querySelectorAll('img'));
          var mq = window.matchMedia('(max-width: 720px)');
          var shown = 12, placed = 0, cols = [], heights = [], n = 0;
          // Fixed columns: a new photo goes to the shortest column, so photos already on screen never move.
          function place() {
            var end = Math.min(shown, imgs.length);
            for (; placed < end; placed++) {
              var img = imgs[placed], k = 0;
              for (var i = 1; i < n; i++) if (heights[i] < heights[k]) k = i;
              cols[k].appendChild(img);
              heights[k] += img.getAttribute('height') / img.getAttribute('width') + 0.08;
            }
            b.hidden = shown >= imgs.length;
          }
          function build() {
            n = mq.matches ? 2 : 3;
            g.textContent = ''; g.classList.add('is-cols');
            cols = []; heights = []; placed = 0;
            for (var i = 0; i < n; i++) {
              var c = document.createElement('div'); c.className = 'gcol';
              g.appendChild(c); cols.push(c); heights.push(0);
            }
            place();
          }
          b.addEventListener('click', function () { shown += 24; place(); b.blur(); });
          function check() { if ((mq.matches ? 2 : 3) !== n) build(); }
          if (mq.addEventListener) mq.addEventListener('change', check); else mq.addListener(check);
          window.addEventListener('resize', check);
          build();
        })();
      </script>
